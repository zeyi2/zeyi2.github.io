<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who Has Seen the Wind?</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: 'Noto Serif SC', serif;
      color: #444;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      background: #f5f5f0;
      animation: backgroundFade 120s infinite alternate;
    }

    /* 背景色慢慢變化 */
    @keyframes backgroundFade {
      0% {
        background: #f5f5f0; /* 淺米白 */
      }
      50% {
        background: #e0f7fa; /* 柔藍色 */
      }
      100% {
        background: #f5f5f0; /* 回到米白 */
      }
    }

    /* 呼吸+漂浮圓圈 */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 0, 0, 0.05) 0%, rgba(0, 0, 0, 0) 70%);
      box-shadow: 0 0 30px 10px rgba(0, 0, 0, 0.03);
      pointer-events: none;
      transform: scale(0.8); /* 初始縮小狀態 */
      animation: ripple 12s infinite ease-in-out, drift 30s infinite linear alternate;
      animation-fill-mode: both;
      z-index: 0;
    }

    /* 呼吸動畫 */
    @keyframes ripple {
      0% {
        transform: scale(0.8);
        opacity: 0.4;
      }
      50% {
        transform: scale(1.5);
        opacity: 0.15;
      }
      100% {
        transform: scale(0.8);
        opacity: 0.4;
      }
    }

    /* 漂移動畫 */
    @keyframes drift {
      0% {
        transform: translate(0px, 0px);
      }
      100% {
        transform: translate(30px, 20px);
      }
    }

    /* 每個圓圈不同大小和位置 */
    .ripple:nth-child(1) {
      width: 200px;
      height: 200px;
      top: 20%;
      left: 25%;
      animation-delay: 0s, 0s;
    }

    .ripple:nth-child(2) {
      width: 250px;
      height: 250px;
      top: 65%;
      left: 65%;
      animation-delay: 3s, 5s;
    }

    .ripple:nth-child(3) {
      width: 220px;
      height: 220px;
      top: 40%;
      left: 50%;
      animation-delay: 6s, 10s;
    }

    .poem {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      z-index: 1;
    }

    .poem p {
      font-size: 1.2em;
      margin: 20px 0;
      opacity: 0.9;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .poem p.fade-out {
      opacity: 0;
      transform: translateY(20px);
    }

    .poem p:hover {
      opacity: 1;
    }
  </style>

  <script>
    function reversePoem() {
      const poemLines = document.querySelectorAll('.poem p');
      const poemContainer = document.querySelector('.poem');

      sequentialFadeOut(Array.from(poemLines), 0, () => {
        const reversedLines = Array.from(poemLines).reverse();
        poemContainer.innerHTML = '';

        reversedLines.forEach(line => {
          line.classList.add('fade-out');
          poemContainer.appendChild(line);
        });

        const newLines = document.querySelectorAll('.poem p');
        setTimeout(() => {
          sequentialFadeIn(Array.from(newLines), 0);
        }, 100);
      });
    }

    function sequentialFadeOut(lines, index, callback) {
      if (index >= lines.length) {
        setTimeout(callback, 100);
        return;
      }

      lines[index].classList.add('fade-out');
      setTimeout(() => {
        sequentialFadeOut(lines, index + 1, callback);
      }, 180);
    }

    function sequentialFadeIn(lines, index) {
      if (index >= lines.length) {
        return;
      }

      lines[index].classList.remove('fade-out');
      setTimeout(() => {
        sequentialFadeIn(lines, index + 1);
      }, 180);
    }
  </script>
</head>

<body>
  <!-- 背景圓圈 -->
  <div class="ripple"></div>
  <div class="ripple"></div>
  <div class="ripple"></div>

  <!-- 詩本體 -->
  <div class="poem" onclick="reversePoem()">
    <p><i>The wind is passing by.</i></p>
    <p><i>But when the trees bow down their heads,</i></p>
    <p><i>Neither you nor I.</i></p>
    <p><i>Who has seen the wind?</i></p>
  </div>
</body>
</html>
